# ---------------------------------------------------------------------
#  DigiQ database settings
#
#  Any value here can be overridden at run time without rebuilding, e.g.
#    -Ddigiq.db.url=jdbc:mysql://localhost:3306/digiq
#    -Ddigiq.db.username=root
#    -Ddigiq.db.password=secret
# ---------------------------------------------------------------------
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/digiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=

db.pool.max=12
db.pool.min=2
